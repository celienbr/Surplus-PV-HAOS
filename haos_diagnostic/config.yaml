name: "Surplus PV - Diagnostic (sans puissance)"
slug: "surplus_pv_diagnostic"
version: "1.0.0-alpha.3"
description: "Lecture gPlugK et simulation du boiler, sans aucune commande materielle"
url: "https://github.com/celienbr/Surplus-PV-HAOS"
arch:
  - aarch64
init: false
startup: application
boot: manual
stage: experimental
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_title: "Surplus PV - Test"
panel_icon: "mdi:solar-power"
panel_admin: true
options:
  pi_entity: sensor.gplugk_z_pi
  po_entity: sensor.gplugk_z_po
  sample_seconds: 10
  max_age_seconds: 60
  demo_water_c: 45
  demo_max_c: 70
  target_export_w: 100
  max_power_w: 6000
  weather_enabled: false
  comfort_time: "06:00"
  grid_backup_enabled: false
  boiler_temperature_entity: ""
  comfort_efficiency: 0.95
  comfort_loss_w: 100
  comfort_margin_minutes: 20
  comfort_grace_minutes: 60
  forecast_today_entity: sensor.energy_production_today_remaining
  forecast_tomorrow_entity: sensor.energy_production_tomorrow
  forecast_solar_entry_id: ""
  pv_actual_power_entity: ""
  pv_actual_energy_today_entity: ""
  pv_actual_energy_total_entity: ""
  pv_actual_max_age_seconds: 120
  pv_actual_sample_seconds: 60
  pv_self_consumption_topology_verified: false
  weather_min_c: 50
  weather_buffer_c: 5
  weather_volume_l: 300
  weather_heat_demand_kwh: 5
  house_today_kwh: 2
  house_tomorrow_kwh: 5
  battery_today_kwh: 0
  battery_tomorrow_kwh: 0
  weather_reserve_w: 0
  pac_enabled: false
  pac_temperature_source: open_meteo
  pac_weather_entity: weather.maison
  pac_timezone: Europe/Zurich
  pac_forecast_temp_entity: sensor.surplus_pv_temperature_demain
  pac_reference_electric_kwh: 8
  pac_reference_temp_c: 7
  pac_balance_temp_c: 16
  pac_reference_cop: 3.5
  pac_cop_change_per_c: 0.1
schema:
  pi_entity: str
  po_entity: str
  sample_seconds: "int(5,60)"
  max_age_seconds: "int(10,300)"
  demo_water_c: "float(0,90)"
  demo_max_c: "float(40,80)"
  target_export_w: "int(0,2000)"
  max_power_w: "int(100,6000)"
  weather_enabled: bool
  comfort_time: str
  grid_backup_enabled: bool
  boiler_temperature_entity: str
  comfort_efficiency: "float(0.5,1)"
  comfort_loss_w: "float(0,1000)"
  comfort_margin_minutes: "float(0,120)"
  comfort_grace_minutes: "float(0,120)"
  forecast_today_entity: str
  forecast_tomorrow_entity: str
  forecast_solar_entry_id: str
  pv_actual_power_entity: str
  pv_actual_energy_today_entity: str
  pv_actual_energy_total_entity: str
  pv_actual_max_age_seconds: "int(10,900)"
  pv_actual_sample_seconds: "int(10,120)"
  pv_self_consumption_topology_verified: bool
  weather_min_c: "int(30,80)"
  weather_buffer_c: "int(0,20)"
  weather_volume_l: "int(1,2000)"
  weather_heat_demand_kwh: "float(0,30)"
  house_today_kwh: "float(0,50)"
  house_tomorrow_kwh: "float(0,50)"
  battery_today_kwh: "float(0,50)"
  battery_tomorrow_kwh: "float(0,50)"
  weather_reserve_w: "int(0,3000)"
  pac_enabled: bool
  pac_temperature_source: "list(open_meteo|sensor)"
  pac_weather_entity: str
  pac_timezone: str
  pac_forecast_temp_entity: str
  pac_reference_electric_kwh: "float(0,70)"
  pac_reference_temp_c: "float(-15,15)"
  pac_balance_temp_c: "float(0,25)"
  pac_reference_cop: "float(1.1,8)"
  pac_cop_change_per_c: "float(0,0.3)"

